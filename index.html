/* Layout: app shell — sticky top bar, demo strip, main board + side rail (stacks on phones). Signal bars = trial count. */
:root {
  --bg: #F3F6F9;
  --surface: #FFFFFF;
  --surface-2: #E9EFF4;
  --ink: #0E2841;
  --ink-2: #4A5D70;
  --line: #D4DEE7;
  --accent: #156082;
  --accent-soft: #E1EEF5;
  --accent-ink: #FFFFFF;
  --signal: #B44E16;
  --signal-soft: #FCEBDF;
  --signal-ink: #FFFFFF;
  --ok: #1D6B2A;
  --ok-soft: #E2F2E4;
  --mid: #8A5A00;
  --mid-soft: #FFF2D2;
  --old: #5C6875;
  --old-soft: #ECEFF2;
  --gold: #9B7618;
  --gold-soft: #FBF3DC;
  --c-kirj: #156082;
  --c-tiiv: #6C45A8;
  --c-kok: #0D7471;
  --c-oma: #B44E16;
  --c-hyv: #56677A;
  --shadow: 0 1px 2px rgba(14,40,65,.06), 0 4px 14px rgba(14,40,65,.06);
  --overlay: rgba(9,22,36,.48);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1723; --surface: #12212F; --surface-2: #1A2C3D; --ink: #E5EDF4; --ink-2: #A3B4C4; --line: #2A3E51;
    --accent: #63B4DB; --accent-soft: #163449; --accent-ink: #08131D;
    --signal: #F2905A; --signal-soft: #3A2316; --signal-ink: #1A0D05;
    --ok: #6CCB7A; --ok-soft: #173322; --mid: #E8B44C; --mid-soft: #3A2E12; --old: #9AA7B4; --old-soft: #22303D;
    --gold: #E2BF62; --gold-soft: #33290F;
    --c-kirj: #63B4DB; --c-tiiv: #B79CEB; --c-kok: #4FC9C4; --c-oma: #F2905A; --c-hyv: #A3B4C4;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --overlay: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1723; --surface: #12212F; --surface-2: #1A2C3D; --ink: #E5EDF4; --ink-2: #A3B4C4; --line: #2A3E51;
  --accent: #63B4DB; --accent-soft: #163449; --accent-ink: #08131D;
  --signal: #F2905A; --signal-soft: #3A2316; --signal-ink: #1A0D05;
  --ok: #6CCB7A; --ok-soft: #173322; --mid: #E8B44C; --mid-soft: #3A2E12; --old: #9AA7B4; --old-soft: #22303D;
  --gold: #E2BF62; --gold-soft: #33290F;
  --c-kirj: #63B4DB; --c-tiiv: #B79CEB; --c-kok: #4FC9C4; --c-oma: #F2905A; --c-hyv: #A3B4C4;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --overlay: rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--ink-2); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand b { font-family: var(--f-display); font-size: 20px; font-weight: 800; letter-spacing: -0.02em; display: block; line-height: 1.1; }
.brand small { display: block; font-size: 12px; color: var(--ink-2); }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
@media (max-width: 640px) { nav.tabs { flex: 1 1 100%; } }
nav.tabs a { text-decoration: none; color: var(--ink-2); font-weight: 600; padding: 8px 12px; border-radius: 999px; }
nav.tabs a:hover { background: var(--surface-2); color: var(--ink); }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.me-pill { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 0; border-radius: 999px; padding: 5px 6px 5px 12px; text-decoration: none; color: var(--ink); font-size: 13px; }
.me-pill .pts { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.me-pill .lvl { background: var(--surface); padding: 3px 10px; border-radius: 999px; font-weight: 600; }
.btn { border: 1px solid transparent; border-radius: 10px; padding: 9px 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.btn-primary { background: var(--signal); color: var(--signal-ink); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-blue { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-small { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.demo-strip { background: var(--accent-soft); color: var(--ink); font-size: 13px; }
.demo-strip .wrap { padding-block: 8px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.demo-strip button { background: none; border: 0; color: var(--accent); font-weight: 700; text-decoration: underline; padding: 0; font-size: 13px; }

main { padding-block: 24px 64px; }
.view-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.view-head h1 { font-size: clamp(26px, 3.4vw, 36px); font-weight: 800; }
.view-head p { margin: 4px 0 0; color: var(--ink-2); max-width: 62ch; }

/* board layout */
.board { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
@media (max-width: 980px) { .board { grid-template-columns: minmax(0, 1fr); } }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
.search { flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
.search input { border: 0; background: transparent; padding: 9px 0; width: 100%; min-width: 0; }
.search input:focus { outline: none; }
.search:focus-within { outline: 3px solid var(--accent); outline-offset: 1px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

.sec { margin-bottom: 30px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 20px; font-weight: 700; }
.sec-head p { margin: 0; font-size: 13px; color: var(--ink-2); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }

/* tip card */
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; min-width: 0; }
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card.classic { border-color: var(--gold); background: linear-gradient(var(--gold-soft), var(--surface) 70%); }
.card.old { opacity: .78; }
.card h3 { font-size: 16.5px; font-weight: 700; line-height: 1.3; }
.card-link { all: unset; cursor: pointer; }
.card-link::after { content: ""; position: absolute; inset: 0; border-radius: var(--r); }
.card-link:focus-visible::after { outline: 3px solid var(--accent); outline-offset: 2px; }
.card .hyoty { margin: 0; font-size: 14px; color: var(--ink-2); flex: 1; }
.cat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
.card-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.vbadge { font-size: 11.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 10px; font-size: 12.5px; }
.by { color: var(--ink-2); font-size: 12.5px; }

.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.status svg { width: 13px; height: 13px; }
.st-todettu { background: var(--ok-soft); color: var(--ok); }
.st-tietyissa { background: var(--mid-soft); color: var(--mid); }
.st-kokeile { background: var(--accent-soft); color: var(--accent); }
.st-vanha { background: var(--old-soft); color: var(--old); }

.signal { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 600; }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.bars i { width: 4px; border-radius: 1px; background: var(--line); display: block; }
.bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 7px; } .bars i:nth-child(3) { height: 10px; } .bars i:nth-child(4) { height: 14px; }
.bars i.on { background: var(--accent); }

/* side rail */
.rail { display: flex; flex-direction: column; gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.panel h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.panel .sub { font-size: 12.5px; color: var(--ink-2); margin: 0 0 12px; }
.rank { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.rank li { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 7px 4px; border-radius: 8px; }
.rank li button { all: unset; cursor: pointer; font-weight: 600; font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.rank li button:hover { color: var(--accent); }
.rank li button:focus-visible { outline: 3px solid var(--accent); }
.rank .n { font-family: var(--f-display); font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.rank .v { font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank li.me { background: var(--signal-soft); }
.q { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.q:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.q p { margin: 0 0 6px; font-weight: 600; font-size: 14px; }
.q .meta { font-size: 12px; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.check-corner { background: var(--surface-2); border: 0; }
.check-corner .claim { font-size: 13.5px; margin: 0 0 6px; }
.check-corner .claim s { color: var(--ink-2); }

/* modal */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 50; display: flex; justify-content: flex-end; }
.drawer { background: var(--bg); width: min(680px, 100%); height: 100%; overflow-y: auto; box-shadow: -8px 0 30px rgba(0,0,0,.2); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-head { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; z-index: 2; }
.drawer-body { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.x { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; font-size: 20px; line-height: 1; flex: none; }
.d-title { font-size: clamp(22px, 3vw, 28px); font-weight: 800; }
.d-hyoty { font-size: 16px; margin: 6px 0 0; }
.d-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.box h3 { font-size: 14px; font-family: var(--f-body); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin-bottom: 8px; }
.box p { margin: 0; }
.kv { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 8px 14px; }
.kv dt { color: var(--ink-2); font-size: 13.5px; }
.kv dd { margin: 0; min-width: 0; }
@media (max-width: 520px) { .kv { grid-template-columns: minmax(0,1fr); } .kv dt { margin-top: 6px; } }
.prompt { position: relative; background: var(--surface-2); border-radius: 10px; padding: 14px 14px 46px; font-family: var(--f-mono); font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt .copy { position: absolute; right: 10px; bottom: 10px; }
.chain { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.chain li { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 10px; position: relative; padding-bottom: 12px; }
.chain li::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
.chain li:last-child::before { display: none; }
.chain .node { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: var(--accent); }
.chain li.cur .node { background: var(--accent); color: var(--accent-ink); }
.chain button { all: unset; cursor: pointer; font-weight: 600; }
.chain button:hover { color: var(--accent); }
.chain button:focus-visible { outline: 3px solid var(--accent); }
.chain small { display: block; color: var(--ink-2); font-size: 12.5px; }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.notes li { border-left: 3px solid var(--line); padding-left: 10px; font-size: 14px; }
.notes li small { display: block; color: var(--ink-2); font-size: 12px; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-weight: 700; margin-bottom: 8px; padding: 0; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
@media (max-width: 520px) { .opts { grid-template-columns: minmax(0,1fr); } }
.opt { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { accent-color: var(--accent); }
label.fl { display: block; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
label.fl span { font-weight: 500; color: var(--ink-2); }
.inp { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
textarea.inp { min-height: 84px; resize: vertical; }
.inp:focus { outline: 3px solid var(--accent); outline-offset: 0; }
.field { display: flex; flex-direction: column; }
.form { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.confirm { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.confirm input { margin-top: 3px; accent-color: var(--accent); }
.agent-note { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-radius: 10px; padding: 12px; font-size: 14px; }
.agent-note svg { flex: none; width: 22px; height: 22px; color: var(--accent); }
.dup { background: var(--mid-soft); border-radius: 10px; padding: 12px; font-size: 14px; }
.private { background: var(--signal-soft); border-radius: 10px; padding: 12px; font-size: 13.5px; }
.steps-ind { display: flex; gap: 6px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.steps-ind span[aria-current="step"] { color: var(--accent); }

/* ask */
.ask { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 28px; align-items: start; }
@media (max-width: 980px) { .ask { grid-template-columns: minmax(0,1fr); } }
.chat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 420px; }
.chat-log { padding: 18px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.msg { max-width: 92%; padding: 12px 14px; border-radius: 14px; font-size: 14.5px; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.msg.bot { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; display: flex; flex-direction: column; gap: 10px; width: 92%; }
.msg.bot .who { font-size: 12px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.hit { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hit button { all: unset; cursor: pointer; font-weight: 700; }
.hit button:hover { color: var(--accent); }
.hit button:focus-visible { outline: 3px solid var(--accent); }
.hit .r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.learned { font-size: 13.5px; border-left: 3px solid var(--mid); padding-left: 10px; }
.chat-in { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 8px; }
.chat-in input { flex: 1; min-width: 0; }
.suggest { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 18px 14px; }

/* me */
.me-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; margin-bottom: 22px; }
@media (max-width: 900px) { .me-grid { grid-template-columns: minmax(0,1fr); } }
.big { font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.prog { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 12px 0 6px; }
.prog i { display: block; height: 100%; background: var(--signal); border-radius: 999px; }
.levels { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
.levels span { font-size: 11.5px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-weight: 600; }
.levels span.on { background: var(--signal); color: var(--signal-ink); }
.two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0,1fr); } }
.ledger { list-style: none; margin: 0; padding: 0; }
.ledger li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.ledger li:last-child { border-bottom: 0; }
.ledger b { font-variant-numeric: tabular-nums; color: var(--ok); white-space: nowrap; }
.fb { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin: 10px 0; }
@media (max-width: 520px) { .fb { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.fb div { background: var(--surface-2); border-radius: 8px; padding: 8px; font-size: 12px; color: var(--ink-2); }
.fb b { display: block; font-family: var(--f-display); font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
.mytip { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
.mytip:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }

/* how */
.flow { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; margin-bottom: 26px; counter-reset: s; }
@media (max-width: 900px) { .flow { grid-template-columns: minmax(0,1fr); } }
.flow div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.flow b { font-family: var(--f-display); font-size: 18px; display: flex; align-items: center; gap: 8px; }
.flow b::before { counter-increment: s; content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; }
.flow p { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
td.num { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.principles { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }

/* toast */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 80; display: flex; flex-direction: column; gap: 8px; align-items: center; width: min(460px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--surface); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; animation: pop .25s ease; }
.toast b { color: var(--signal); font-family: var(--f-display); font-size: 16px; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card, .toast { transition: none; animation: none; } .card:hover { transform: none; } }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--ink-2); font-size: 14px; }

/* ---------- Neon 86 skin: 80s Miami night — sunset, neon tubes, perspective grid. Single committed dark look. ---------- */
body.neon {
  --bg: #140A2E; --surface: #1D1043; --surface-2: #2A1858; --ink: #F7EFFF; --ink-2: #C6B6E8; --line: #47317F;
  --accent: #2EE6F2; --accent-soft: #15365A; --accent-ink: #0B0620;
  --signal: #FF4FA3; --signal-soft: #3D1642; --signal-ink: #1A0620;
  --ok: #5CF2A0; --ok-soft: #123B33; --mid: #FFD166; --mid-soft: #3C3016; --old: #AB9DCB; --old-soft: #2A2148;
  --gold: #FFC857; --gold-soft: #33240F;
  --c-kirj: #2EE6F2; --c-tiiv: #B48CFF; --c-kok: #5CF2C8; --c-oma: #FF9A4D; --c-hyv: #C6B6E8;
  --shadow: 0 6px 22px rgba(5,2,20,.55); --overlay: rgba(6,2,18,.72);
  --f-display: "Righteous", "Bricolage Grotesque", system-ui, sans-serif;
  --pink: #FF4FA3; --orange: #FF8A3D; --cyan: #2EE6F2;
  color-scheme: dark;
  background:
    radial-gradient(900px 520px at 85% -8%, rgba(255,79,163,.20), transparent 70%),
    radial-gradient(800px 480px at -5% 10%, rgba(46,230,242,.12), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
body.neon::before { background: #0E0624; }
body.neon h1, body.neon h2, body.neon h3 { letter-spacing: 0.01em; font-weight: 400; }
body.neon .view-head h1 { text-shadow: 0 0 18px rgba(46,230,242,.35); }
body.neon .top { background: #0E0624; border-bottom: 1px solid transparent; border-image: linear-gradient(90deg, var(--pink), var(--orange), var(--cyan)) 1; }
body.neon .brand b { font-family: "Yellowtail", cursive; font-weight: 400; font-size: 27px; letter-spacing: 0; color: var(--pink); text-shadow: 0 0 10px rgba(255,79,163,.7); }
body.neon .brand b .ai { font-family: "Righteous", sans-serif; font-size: 17px; color: var(--cyan); text-shadow: 0 0 8px rgba(46,230,242,.7); margin-right: 3px; vertical-align: 3px; }
body.neon nav.tabs a[aria-current="page"] { background: transparent; color: var(--cyan); box-shadow: inset 0 0 0 1px var(--cyan), 0 0 12px rgba(46,230,242,.35); }
body.neon .btn-primary { background: linear-gradient(90deg, var(--pink), var(--orange)); color: #1A0620; box-shadow: 0 0 16px rgba(255,79,163,.45); }
body.neon .btn-blue { box-shadow: 0 0 14px rgba(46,230,242,.35); }
body.neon .demo-strip { background: #1A0E3D; }
body.neon .card { background: rgba(29,16,67,.93); }
body.neon .view-head, body.neon .sec-head, body.neon .why b { text-shadow: 0 1px 2px rgba(10,4,26,.95), 0 0 14px rgba(10,4,26,.85); }
body.neon .view-head p, body.neon .sec-head p, body.neon .view-head .eyebrow { color: #E4D8FA; }
body.neon .panel { background: rgba(29,16,67,.93); }
body.neon .card:hover { border-color: var(--pink); box-shadow: 0 0 0 1px var(--pink), 0 0 22px rgba(255,79,163,.35); }
body.neon .card.classic { background: rgba(29,16,67,.88); border-color: var(--gold); box-shadow: 0 0 16px rgba(255,200,87,.25); }
body.neon .bars i.on { background: var(--cyan); box-shadow: 0 0 6px rgba(46,230,242,.8); }
body.neon .chip[aria-pressed="true"] { background: var(--pink); color: #1A0620; border-color: var(--pink); }
body.neon .toast { background: #0B0620; color: var(--ink); border: 1px solid var(--pink); box-shadow: 0 0 20px rgba(255,79,163,.45); }
body.neon .toast b { color: var(--cyan); text-shadow: 0 0 8px rgba(46,230,242,.8); font-family: "Righteous", sans-serif; font-size: 20px; }
body.neon .prog i { background: linear-gradient(90deg, var(--pink), var(--orange)); box-shadow: 0 0 10px rgba(255,79,163,.6); }
body.neon .big { font-family: "Righteous", sans-serif; font-weight: 400; color: var(--cyan); text-shadow: 0 0 14px rgba(46,230,242,.45); }
body.neon .msg.user { background: linear-gradient(90deg, var(--pink), #D0479A); color: #1A0620; }
body.neon .check-corner { background: #22124D; }
body.neon .drawer { background: #140A2E; }
/* Neon side rail: lifted on lighter violet-pink panels with a thin neon gradient frame (lighter, never darker). */
body.neon .rail .panel {
  --ink-2: #E6DAFA; --line: rgba(255,255,255,.22); --surface-2: rgba(255,255,255,.12);
  background: linear-gradient(160deg, #4A2C82, #5A2F7A) padding-box, linear-gradient(135deg, var(--pink), var(--orange), var(--cyan)) border-box;
  border: 1.5px solid transparent;
  box-shadow: 0 0 18px rgba(255,79,163,.22), 0 0 30px rgba(46,230,242,.10);
}
body.neon .rail .panel h2 { color: var(--gold); }
body.neon .rail .rank li.me { background: rgba(255,79,163,.24); box-shadow: inset 0 0 0 1px rgba(255,79,163,.65); }

/* hero (neon only) */
.hero { display: none; }

.hero svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
.hero-in { padding: 34px clamp(18px, 4vw, 44px) 38px; display: flex; flex-direction: column; gap: 10px; max-width: 640px; }
.hero .freq { font-family: "Monoton", "Righteous", sans-serif; font-size: clamp(22px, 3.4vw, 34px); color: var(--cyan); text-shadow: 0 0 10px rgba(46,230,242,.85), 0 0 26px rgba(46,230,242,.45); letter-spacing: .04em; line-height: 1; }
.hero .logo { font-family: "Yellowtail", cursive; font-size: clamp(54px, 9vw, 96px); line-height: .9; color: #FFE3F1; text-shadow: 0 0 6px #FF4FA3, 0 0 18px #FF4FA3, 0 0 42px rgba(255,79,163,.7); margin: 0; font-weight: 400; transform: rotate(-4deg); transform-origin: left center; }
.hero .logo .ai { font-family: "Righteous", sans-serif; font-size: .38em; color: #E9FDFF; text-shadow: 0 0 8px #2EE6F2, 0 0 22px #2EE6F2; vertical-align: .9em; margin-right: 6px; }
.hero p { margin: 4px 0 0; font-size: 17px; font-weight: 600; color: #FFF4FA; text-shadow: 0 2px 10px rgba(20,6,46,.8); max-width: 54ch; }
.hero .row { margin-top: 8px; }
.hero .btn-ghost { background: rgba(14,6,36,.55); border-color: rgba(255,255,255,.35); color: #fff; backdrop-filter: blur(4px); }
@media (max-width: 640px) { body.neon .hero { min-height: 240px; } .hero p { font-size: 15px; } }

.ticker { display: none; }
body.neon .ticker { display: flex; align-items: center; gap: 12px; margin: 14px 0 22px; background: #0B0620; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ticker .lbl { flex: none; font-family: "Righteous", sans-serif; font-size: 13px; letter-spacing: .1em; color: #1A0620; background: var(--orange); padding: 9px 12px; display: flex; align-items: center; gap: 8px; }
.ticker .lbl i { width: 8px; height: 8px; border-radius: 50%; background: #1A0620; animation: blink 1.2s steps(2) infinite; }
.ticker .track { flex: 1; min-width: 0; overflow: hidden; }
.ticker .run { display: inline-flex; gap: 36px; white-space: nowrap; padding-right: 36px; animation: run 48s linear infinite; font-weight: 600; font-size: 14px; color: var(--ink); }
.ticker .run span::before { content: "♪"; color: var(--pink); margin-right: 10px; }
@keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .ticker .run { animation: none; white-space: normal; flex-wrap: wrap; gap: 6px 24px; padding: 8px 0; } .ticker .lbl i { animation: none; } .hero .logo { transform: none; } }
.skin-btn { display: inline-flex; gap: 8px; align-items: center; }
.badge { flex: none; display: inline-block; vertical-align: middle; }
body.neon .badge { filter: drop-shadow(0 0 4px currentColor); }
.me-pill .lvl { display: inline-flex; align-items: center; gap: 6px; }
.by { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.who-cell { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.who-cell span { min-width: 0; overflow-wrap: anywhere; }
.rank li.lead3 .n { color: var(--gold); }
.mark { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; font-size: 11.5px; font-weight: 800; color: var(--gold); vertical-align: 1px; }
.mark svg { width: 13px; height: 13px; }
.marks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.marks span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
.marks svg { width: 13px; height: 13px; }
.rank li .sub2 { display: block; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.seg { display: flex; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 3px; margin-bottom: 10px; }
.seg button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 6px 8px; font-weight: 700; font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--signal); color: var(--signal-ink); }
.more-link { display: inline-block; margin-top: 8px; font-size: 13px; font-weight: 700; color: var(--accent); }
.lb-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; margin-bottom: 16px; }
@media (max-width: 980px) { .lb-grid { grid-template-columns: minmax(0,1fr); } }
.lb-grid .rank li { padding: 9px 6px; }
.podium { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.podium b { font-family: var(--f-display); font-size: 18px; display: block; }
.podium small { color: var(--ink-2); }
.lvl-row { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; margin-top: 12px; }
.lvl-row div { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
.lvl-row div.locked { opacity: .38; }
.lvl-row small { font-weight: 500; }
.lvl-head { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
.optout { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--ink-2); margin-top: 10px; }
.optout input { margin-top: 2px; accent-color: var(--accent); }
.tick-btn { flex: none; background: none; border: 0; color: var(--ink-2); font-size: 12.5px; font-weight: 700; padding: 0 14px; text-decoration: underline; }

body.neon .demo-strip, body.neon main { position: relative; z-index: 1; }
.onboard { display: grid; grid-template-columns: auto repeat(3, minmax(0,1fr)) auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; margin-bottom: 22px; }
.onboard .t { font-family: var(--f-display); font-size: 17px; }
.onboard button.step { all: unset; cursor: pointer; display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-weight: 600; font-size: 14px; }
.onboard button.step:hover { background: var(--surface-2); }
.onboard button.step:focus-visible { outline: 3px solid var(--accent); }
.onboard .num { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--signal); color: var(--signal-ink); font-weight: 800; font-size: 13px; }
.onboard .hide { background: none; border: 0; color: var(--ink-2); font-size: 13px; text-decoration: underline; }
@media (max-width: 860px) { .onboard { grid-template-columns: minmax(0,1fr); } }
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
@media (max-width: 760px) { .metrics { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.metrics div { background: var(--surface-2); border-radius: 10px; padding: 12px; font-size: 13px; color: var(--ink-2); }
.metrics b { display: block; font-family: var(--f-display); font-size: 26px; color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 700; }
.why { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-bottom: 22px; }
@media (max-width: 760px) { .why { grid-template-columns: minmax(0,1fr); } }
.why div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; font-size: 14.5px; }
.why b { display: block; font-family: var(--f-display); font-size: 17px; margin-bottom: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const tip = (id) => S.tips.find((x) => x.id === id);
  const days = (d) => d === 0 ? "tänään" : d === 1 ? "eilen" : d < 7 ? d + " pv sitten" : d < 60 ? Math.round(d / 7) + " vk sitten" : Math.round(d / 30) + " kk sitten";
  const short = (n) => { const p = n.split(" "); return p.length > 1 ? p[0] + " " + p[1][0] + "." : n; };
  function stats(t) { const n = t.r.hyvin + t.r.osittain + t.r.ei + t.r.tark; const u = t.r.hyvin + t.r.osittain; return { n, u, pct: n ? Math.round((u / n) * 100) : 0 }; }
  function status(t) {
    if (t.old) return { k: "vanha", label: "Vanhentunut" };
    const s = stats(t);
    if (s.n < 5) return { k: "kokeile", label: "Kokeile" };
    if (s.pct >= 70) return { k: "todettu", label: "Todettu toimivaksi" };
    if (s.pct >= 45) return { k: "tietyissa", label: "Toimii tietyissä tilanteissa" };
    return { k: "kokeile", label: "Kokeile" }; // weak tips keep the neutral label and just sink in the order
  }
  function isWeak(t) { const s = stats(t); return !t.old && s.n >= 5 && s.pct < 45; }
  function spread(t) { const n = stats(t).n; return n ? Math.min(9, Math.max(1, Math.round(Math.sqrt(n) * 1.3))) : 0; }
  function score(t) { const s = stats(t); return (t.old ? -50 : 0) + s.u * 1.0 + t.r.hyvin * 0.5 - (t.r.ei + t.r.tark) * 0.4 + Math.max(0, 10 - t.days) * 0.3; }
  function seasonScore(t) { return t.old ? -1 : t.s * (stats(t).pct / 100); }
  function depth(t) { let d = 1, p = t; while (p.parent && tip(p.parent)) { d++; p = tip(p.parent); } return d; }
  function root(t) { let p = t; while (p.parent && tip(p.parent)) p = tip(p.parent); return p; }
  function chainOf(t) {
    const r = root(t); const out = [r];
    let cur = r; let next;
    while ((next = S.tips.find((x) => x.parent === cur.id))) { out.push(next); cur = next; }
    return out;
  }
  const hasChild = (t) => S.tips.some((x) => x.parent === t.id);
  function level(p) { let l = LEVELS[0], i = 0; LEVELS.forEach((x, j) => { if (p >= x.min) { l = x; i = j; } }); return { l, i, next: LEVELS[i + 1] || null }; }

  const ICON = {
    ok: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    half: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>',
    try: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2v4.5L2.8 12.2A1.2 1.2 0 0 0 3.9 14h8.2a1.2 1.2 0 0 0 1.1-1.8L10 6.5V2M5 2h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    clock: '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 5v3.3l2.2 1.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    radio: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="15" r="2.6" fill="currentColor"/><path d="M7.5 10.5a6.4 6.4 0 0 1 9 0M4.5 7.5a10.6 10.6 0 0 1 15 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };
  function statusChip(t) {
    const s = status(t); if (!s) return "";
    const ic = { todettu: ICON.ok, tietyissa: ICON.half, kokeile: ICON.try, vanha: ICON.clock }[s.k];
    return '<span class="status st-' + s.k + '">' + ic + s.label + "</span>";
  }
  function signal(t) {
    const n = stats(t).n; const lv = n === 0 ? 0 : n < 5 ? 1 : n < 10 ? 2 : n < 25 ? 3 : 4;
    let b = ""; for (let i = 1; i <= 4; i++) b += '<i class="' + (i <= lv ? "on" : "") + '"></i>';
    return '<span class="signal"><span class="bars" aria-hidden="true">' + b + "</span>" + (n === 0 ? "Ei vielä kokeiltu" : n + (n === 1 ? " kokeilu" : " kokeilua")) + "</span>";
  }
  function catTag(t) { const c = CATS[t.cat]; return '<span class="cat"><span class="dot" style="background:' + c.c + '"></span>' + esc(c.name) + "</span>"; }

  function card(t, extra) {
    const d = depth(t); const cls = ["card"]; if (extra === "classic") cls.push("classic"); if (t.old) cls.push("old");
    return '<article class="' + cls.join(" ") + '">' +
      '<div class="card-top">' + catTag(t) + (d > 1 ? '<span class="vbadge">Parannettu · v' + d + "</span>" : "") + "</div>" +
      '<h3><button class="card-link" type="button" data-open="' + t.id + '">' + esc(t.title) + "</button></h3>" +
      '<p class="hyoty">' + esc(t.hyoty) + "</p>" +
      '<div class="card-foot">' + (statusChip(t) || "<span></span>") + signal(t) + "</div>" +
      '<div class="by">' + badge(t.mine ? level(S.me.alltime).i : personLevel(t.author.name), 18, false) + "<span>" + (t.mine ? "Sinun vinkkisi" : esc(short(t.author.name)) + " · " + esc(t.author.unit)) + " · " + days(t.days) + "</span></div>" +
      "</article>";
  }
  const latest = (list) => list.filter((t) => !hasChild(t));

  /* ---------- toast & points ---------- */
  function toast(html) {
    const el = document.createElement("div"); el.className = "toast"; el.innerHTML = html;
    $("#toasts").appendChild(el); setTimeout(() => el.remove(), 3600);
  }
  function award(p, label) {
    const before = level(S.me.alltime).i;
    S.me.season += p; S.me.alltime += p;
    S.me.ledger.unshift({ t: label, p, d: 0 });
    toast("<b>+" + p + "</b> " + esc(label));
    const after = level(S.me.alltime);
    if (after.i > before) setTimeout(() => toast(badge(after.i, 30, true) + "Uusi taso: <b>" + esc(after.l.name) + "</b>"), 700);
  }

  /* ---------- views ---------- */
  let filterCat = "all", query = "";
  function seasonInfo() {
    const now = new Date(); const months = ["Tammikuun", "Helmikuun", "Maaliskuun", "Huhtikuun", "Toukokuun", "Kesäkuun", "Heinäkuun", "Elokuun", "Syyskuun", "Lokakuun", "Marraskuun", "Joulukuun"];
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    return { name: months[now.getMonth()] + " kausi", left: end - now.getDate() };
  }

  function viewBoard() {
    const all = latest(S.tips);
    const filtered = all.filter((t) => (filterCat === "all" || t.cat === filterCat) && (!query || matchScore(t, tokens(query)) > 0));
    const chips = '<button class="chip" type="button" data-cat="all" aria-pressed="' + (filterCat === "all") + '">Kaikki</button>' +
      Object.keys(CATS).map((k) => '<button class="chip" type="button" data-cat="' + k + '" aria-pressed="' + (filterCat === k) + '"><span class="dot" style="background:' + CATS[k].c + '"></span>' + CATS[k].name + "</button>").join("");
    let body = "";
    if (filterCat !== "all" || query) {
      const list = filtered.sort((a, b) => score(b) - score(a));
      body = sec("Hakutulokset", list.length + " vinkkiä. Hyödyllisiksi koetut ensin.", list.length ? '<div class="grid">' + list.map((t) => card(t)).join("") + "</div>" : '<div class="empty">Vinkkiä ei löytynyt. Kokeile <a href="#kysy">Kysy Puskaradiolta</a> -toimintoa tai jaa oma vinkki.</div>');
    } else {
      const live = all.filter((t) => !t.old);
      const top = live.filter((t) => { const s = status(t); return s && (s.k === "todettu" || s.k === "tietyissa"); }).sort((a, b) => seasonScore(b) - seasonScore(a)).slice(0, 3);
      const fresh = live.filter((t) => t.days <= 7 && stats(t).n > 0).sort((a, b) => a.days - b.days);
      const first = live.filter((t) => stats(t).n === 0).sort((a, b) => a.days - b.days);
      const classics = live.filter((t) => !top.includes(t) && status(t) && status(t).k === "todettu").sort((a, b) => stats(b).u - stats(a).u).slice(0, 3);
      const used = new Set([...top, ...fresh, ...first, ...classics].map((t) => t.id));
      const rest = all.filter((t) => !used.has(t.id)).sort((a, b) => score(b) - score(a));
      body = sec("Kauden kärki", "Kuun aikana eniten hyötyä tuottaneet vinkit.", '<div class="grid">' + top.map((t) => card(t)).join("") + "</div>") +
        (first.length ? sec("Kuka kokeilee ensin?", "Ensimmäinen kokeilija saa +3 lisäpistettä.", '<div class="grid">' + first.map((t) => card(t)).join("") + "</div>") : "") +
        (fresh.length ? sec("Juuri jaettu", "Viimeisen viikon aikana kiertoon laitetut.", '<div class="grid">' + fresh.map((t) => card(t)).join("") + "</div>") : "") +
        sec("Puskaradion klassikot", "Kaikkien aikojen eniten toimineet vinkit.", '<div class="grid">' + classics.map((t) => card(t, "classic")).join("") + "</div>") +
        sec("Kaikki muut vinkit", "Hyödyllisiksi koetut nousevat ensin.", '<div class="grid">' + rest.map((t) => card(t)).join("") + "</div>");
    }
    const si = seasonInfo();
    return heroHTML() + '<div class="view-head"><div><span class="eyebrow">' + esc(si.name) + " · " + si.left + " päivää jäljellä" + (skin === "neon" ? " · Kauden teema: Neon 86" : "") + '</span><h1>Kierrossa olevat vinkit</h1><p>Työkavereiden kokeilemat tavat käyttää tekoälyä. Avaa vinkki, kokeile sitä omassa työssäsi ja kerro, miten kävi.</p></div></div>' +
      (S.onboarded ? "" : '<div class="onboard" role="region" aria-label="Aloita tästä"><span class="t">Aloita tästä</span>' +
        '<button class="step" type="button" data-open="t1"><span class="num">1</span>Avaa vinkki ja kokeile sitä</button>' +
        '<button class="step" type="button" id="obShare"><span class="num">2</span>Jaa oma vinkki</button>' +
        '<button class="step" type="button" id="obAsk"><span class="num">3</span>Kysy Puskaradiolta</button>' +
        '<button class="hide" type="button" id="obHide">Piilota</button></div>') +
      '<div class="board"><div>' +
      '<div class="filters"><label class="search"><span class="sr">Hae vinkkejä</span><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Hae vinkkejä, esim. muistio tai Excel" value="' + esc(query) + '"></label>' + chips + "</div>" +
      body + "</div>" + rail() + "</div>";
  }
  /* ---------- Neon 86: hero + ticker ---------- */
  let tickerPaused = false;
  function heroHTML() {
    const items = latest(S.tips).filter((t) => !t.old).sort((a, b) => a.days - b.days).slice(0, 4).map((t) => "Juuri kierrossa: “" + t.title + "” – " + (t.mine ? "sinulta" : short(t.author.name)))
      .concat(latest(S.tips).filter((t) => status(t) && status(t).k === "todettu").slice(0, 3).map((t) => "Todettu toimivaksi: “" + t.title + "”, " + stats(t).n + " kokeilua"));
    const run = items.map((x) => "<span>" + esc(x) + "</span>").join("");
    return '<section class="hero" aria-label="AI Puskaradio 25.5 FM">' +
      '<div class="hero-in"><span class="freq">25.5 FM</span><h2 class="logo"><span class="ai">AI</span>Puskaradio</h2>' +
      "<p>Löydä Veron kollegoiden tekoälyvinkit täältä. Älä istu ideasi päällä, vaan laita se kiertoon. Kokeile muiden vinkkejä, anna palautetta ja jalosta parhaat eteenpäin. Kaikesta saa pisteitä!</p>" +
      '<div class="row"><button class="btn btn-primary" type="button" id="heroShare">+ Jaa vinkki</button><a class="btn btn-ghost" href="#kysy">Kysy Puskaradiolta</a></div></div></section>' +
      '<div class="ticker' + (tickerPaused ? " paused" : "") + '" role="marquee" aria-label="Nyt Puskaradiossa"><span class="lbl"><i aria-hidden="true"></i>NYT SOI</span><div class="track"><div class="run">' + run + '</div></div><button class="tick-btn" type="button" id="tickBtn" aria-pressed="' + tickerPaused + '">' + (tickerPaused ? "Jatka" : "Pysäytä") + "</button></div>";
  }

  function sec(h, p, inner) { return '<section class="sec"><div class="sec-head"><h2>' + esc(h) + "</h2><p>" + esc(p) + "</p></div>" + inner + "</section>"; }

  const PART = { "Yksikkö 3": 62, "Yksikkö 2": 71, "Yksikkö 1": 78, "Yksikkö 6": 54, "Yksikkö 4": 66, "Yksikkö 5": 83, "Oma yksikkö": 69 };
  function unitBoard() {
    const u = {};
    latest(S.tips).filter((t) => !t.old).forEach((t) => { const k = t.mine ? "Oma yksikkö" : t.author.unit; u[k] = (u[k] || 0) + Math.max(0, spread(t) - 1); });
    Object.keys(PART).forEach((k) => { if (!(k in u)) u[k] = 0; });
    const list = Object.keys(u).map((k) => ({ k, v: u[k] })).sort((a, b) => b.v - a.v);
    const own = list.findIndex((x) => x.k === "Oma yksikkö");
    const rows = list.slice(0, 5).map((x, i) => ({ x, i }));
    if (own >= 5) rows.push({ x: list[own], i: own });
    return '<section class="panel"><h2>Yksiköiden kisa</h2><p class="sub">Kenen vinkit leviävät tällä kaudella eniten muihin yksiköihin. Listalla näkyy kärkiviisikko ja oma yksikkösi.</p><ol class="rank">' +
      rows.map(({ x, i }) => '<li class="' + (x.k === "Oma yksikkö" ? "me" : "") + '"><span class="n">' + (i + 1) + "</span><span>" + esc(x.k === "Oma yksikkö" ? "Oma yksikkösi" : x.k) + '</span><span class="v">' + x.v + " leviämistä</span></li>").join("") + "</ol></section>";
  }
  function personLevel(name) { const p = PEOPLE.find((x) => x.name === name); return p ? level(p.a).i : 0; }
  function peopleRows() {
    return PEOPLE.map((p) => ({ label: p.name, sub: p.team + " · " + p.unit, v: p.s, lv: level(p.a).i, marks: (MARKS[p.name] || []).length }))
      .concat([{ label: S.me.hideName ? "Sinä (nimi piilotettu muilta)" : "Sinä", sub: MY_TEAM + " · Oma yksikkösi", v: S.me.season, lv: level(S.me.alltime).i, me: true, marks: MY_MARKS.length }])
      .sort((a, b) => b.v - a.v);
  }
  function teamRows() {
    return TEAMS.map((t) => {
      let tot = t.base; PEOPLE.forEach((p) => { if (p.team === t.name) tot += p.s; });
      if (t.name === MY_TEAM) tot += S.me.season;
      return { label: t.name, sub: t.unit + " · " + t.size + " jäsentä", v: Math.round(tot / t.size), me: t.name === MY_TEAM };
    }).sort((a, b) => b.v - a.v);
  }
  function unitRows() {
    const u = {};
    latest(S.tips).filter((t) => !t.old).forEach((t) => { const k = t.mine ? "Oma yksikkö" : t.author.unit; u[k] = (u[k] || 0) + Math.max(0, spread(t) - 1); });
    Object.keys(PART).forEach((k) => { if (!(k in u)) u[k] = 0; });
    return Object.keys(u).map((k) => ({ label: k === "Oma yksikkö" ? "Oma yksikkösi" : k, sub: "Osallistumisaste " + (PART[k] || 0) + " %", v: u[k], me: k === "Oma yksikkö" })).sort((a, b) => b.v - a.v);
  }
  const UNITW = { p: "p", t: "p / jäsen", u: "leviämistä" };
  function lbList(rows, n, unitWord) {
    const own = rows.findIndex((r) => r.me);
    const show = rows.slice(0, n).map((r, i) => ({ r, i }));
    if (own >= n) show.push({ r: rows[own], i: own });
    return '<ol class="rank">' + show.map(({ r, i }) => '<li class="' + (r.me ? "me " : "") + (i < 3 ? "lead3" : "") + '"><span class="n">' + (i + 1) + '</span><span class="who-cell">' +
      (r.lv != null ? badge(r.lv, 24, false) : "") + "<span>" + esc(r.label) + markTag(r.marks) + (r.sub ? '<span class="sub2">' + esc(r.sub) + "</span>" : "") + '</span></span><span class="v">' + r.v + " " + unitWord + "</span></li>").join("") + "</ol>";
  }
  let lbTab = "p";
  function leaderMini() {
    const rows = lbTab === "p" ? peopleRows() : lbTab === "t" ? teamRows() : unitRows();
    const btn = (k, l) => '<button type="button" data-lb="' + k + '" aria-pressed="' + (lbTab === k) + '">' + l + "</button>";
    return '<section class="panel"><h2>Kauden kärki</h2><p class="sub">Kuka johtaa ' + esc(seasonInfo().name.toLowerCase()) + "a? Kausi nollautuu kuun vaihteessa.</p>" +
      '<div class="seg" role="group" aria-label="Valitse taso">' + btn("p", "Yksilöt") + btn("t", "Tiimit") + btn("u", "Yksiköt") + "</div>" +
      lbList(rows, 3, UNITW[lbTab]) + '<a class="more-link" href="#tulostaulu">Koko tulostaulu →</a></section>';
  }
  function viewLeaders() {
    const ppl = peopleRows(), tms = teamRows(), uns = unitRows();
    const lead = (rows, label, unit) => { const r = rows[0]; return '<div class="podium">' + (r.lv != null ? badge(r.lv, 44, false) : '<svg class="badge" width="44" height="44" viewBox="0 0 48 48" aria-hidden="true" style="color:#FFC857"><path d="M13 31l1.8-13 5.4 6.5L24 14l3.8 10.5 5.4-6.5L35 31z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>') + "<div><small>" + label + "</small><b>" + esc(r.label) + "</b><small>" + r.v + " " + unit + "</small></div></div>"; };
    const top = latest(S.tips).filter((t) => !t.old && t.s > 0).sort((a, b) => seasonScore(b) - seasonScore(a)).slice(0, 5);
    const brave = S.brave.concat([{ name: "Sinä", n: S.me.trials, me: true }]).sort((a, b) => b.n - a.n).slice(0, 5);
    return '<div class="view-head"><div><span class="eyebrow">' + esc(seasonInfo().name) + " · " + seasonInfo().left + ' päivää jäljellä</span><h1>Tulostaulu</h1><p>Kilpailu kolmella tasolla. Kausi nollautuu kuun vaihteessa, mutta tasot ja kausimerkit säilyvät. Listoilla näkyy kärki ja oma sijoituksesi. Tiimit kilpailevat jäsentä kohden lasketuilla pisteillä, joten pienikin tiimi voi voittaa.</p></div></div>' +
      '<div class="lb-grid">' +
      '<section class="panel"><h2>Yksilöt</h2><p class="sub">Kauden pisteet.</p>' + lead(ppl, "Kauden kärjessä", "pistettä") + lbList(ppl, 10, "p") + "</section>" +
      '<section class="panel"><h2>Tiimit</h2><p class="sub">Kauden pisteet jäsentä kohden.</p>' + lead(tms, "Kauden paras tiimi", "pistettä / jäsen") + lbList(tms, 5, "p / jäsen") + "</section>" +
      '<section class="panel"><h2>Yksiköt</h2><p class="sub">Vinkkien leviäminen muihin yksiköihin.</p>' + lead(uns, "Kauden yksikkö", "leviämistä") + lbList(uns, 5, "leviämistä") + "</section></div>" +
      '<section class="panel" style="margin-bottom:16px"><h2>Kunniagalleria</h2><p class="sub">Aiempien kausien voittajat jäävät pysyvästi näkyviin. Kauden kärkikolmikko ja voittajatiimin jäsenet saavat profiiliinsa kausimerkin (' + STAR.replace("<svg", '<svg width="12" height="12" style="color:var(--gold);vertical-align:-1px"') + ').</p><div class="tbl-wrap"><table><thead><tr><th>Kausi</th><th>Kauden yksilö</th><th>Kauden tiimi</th><th>Kauden yksikkö</th><th>Kauden vinkki</th></tr></thead><tbody>' +
      HALL.map((h) => "<tr><td><b>" + esc(h.season) + '</b></td><td><span class="who-cell">' + badge(personLevel(h.person), 22, false) + "<span>" + esc(h.person) + "</span></span></td><td>" + esc(h.team) + "</td><td>" + esc(h.unit) + "</td><td>" + esc(h.tip) + "</td></tr>").join("") +
      "</tbody></table></div></section>" +
      '<div class="two"><section class="panel"><h2>Kuun hyödyllisimmät vinkit</h2><p class="sub">Vinkit, jotka toimivat tässä kuussa useimmille.</p><ol class="rank">' +
      top.map((t, i) => '<li class="' + (i < 3 ? "lead3" : "") + '"><span class="n">' + (i + 1) + '</span><button type="button" data-open="' + t.id + '">' + esc(t.title) + '</button><span class="v">' + t.s + " kok.</span></li>").join("") + "</ol></section>" +
      '<section class="panel"><h2>Kuun rohkeimmat kokeilijat</h2><p class="sub">Eniten kollegoiden vinkkejä kokeilleet.</p><ol class="rank">' +
      brave.map((b, i) => '<li class="' + (b.me ? "me " : "") + (i < 3 ? "lead3" : "") + '"><span class="n">' + (i + 1) + '</span><span class="who-cell">' + badge(b.me ? level(S.me.alltime).i : personLevel(b.name), 24, false) + "<span>" + esc(b.name) + '</span></span><span class="v">' + b.n + " kokeilua</span></li>").join("") + "</ol></section></div>";
  }
  function rail() {
    const top = latest(S.tips).filter((t) => !t.old && t.s > 0).sort((a, b) => seasonScore(b) - seasonScore(a)).slice(0, 5);
    const brave = S.brave.concat([{ name: "Sinä", n: S.me.trials, me: true }]).sort((a, b) => b.n - a.n).slice(0, 5);
    return '<aside class="rail" aria-label="Kauden listat ja kysymykset">' +
      '<section class="panel"><h2>Kuun hyödyllisimmät</h2><p class="sub">Vinkit, jotka toimivat tässä kuussa useimmille.</p><ol class="rank">' +
      top.map((t, i) => '<li><span class="n">' + (i + 1) + '</span><button type="button" data-open="' + t.id + '">' + esc(t.title) + '</button><span class="v">' + t.s + " kok.</span></li>").join("") + "</ol></section>" +
      leaderMini() +
      '<section class="panel"><h2>Avoimet kysymykset</h2><p class="sub">Kysymyksiä, joihin ei vielä löytynyt vinkkiä.</p>' +
      (S.questions.length ? S.questions.map((q) => '<div class="q"><p>' + esc(q.text) + '</p><div class="meta"><span>' + esc(q.by) + " · " + days(q.days) + '</span><button class="btn btn-ghost btn-small" type="button" data-answer="' + q.id + '">Vastaa vinkillä</button></div></div>').join("") : '<p class="sub">Kaikkiin kysymyksiin on vastattu.</p>') +
      "</section>" +
      '<section class="panel check-corner"><h2>Tarkistitko tämän?</h2><p class="sub">Kuun opettavaisin tekoälyn erehdys.</p><p class="claim">Copilot väitti muutoksen tulleen voimaan <s>vuonna 2018</s>. Oikea vuosi oli 2020.</p><p class="sub" style="margin:0">Opetus: päivämäärät ja lainkohdat tarkistetaan aina alkuperäisestä lähteestä.</p></section>' +
      "</aside>";
  }

  /* ---------- search / agent ---------- */
  function tokens(s) { return String(s).toLowerCase().split(/[^a-zåäö0-9]+/).filter((w) => w.length >= 3).map((w) => w.slice(0, 6)); }
  const STOP = new Set(tokens("miten onko kenelläkään jolla tämän tästä jonka saisin saada voisi haluan halua minulla pitää pitäisi tavan tapaa tekoäly copilot copilotia käyttää kahta kahden"));
  function matchScore(t, q) {
    const f = [[t.title, 3], [t.hyoty, 2], [t.tehtava, 2], [t.miten, 1], [CATS[t.cat].name, 1], [t.tool, 2]];
    let sc = 0; q.forEach((w) => { if (STOP.has(w)) return; f.forEach(([txt, wt]) => { if (tokens(txt).includes(w)) sc += wt; }); });
    return sc;
  }
  function askAgent(text) {
    const q = tokens(text);
    const hits = latest(S.tips).map((t) => ({ t, m: matchScore(t, q) })).filter((x) => x.m >= 2);
    const good = hits.filter((x) => !x.t.old && !isWeak(x.t)).sort((a, b) => (b.m + score(b.t) * 0.2) - (a.m + score(a.t) * 0.2)).slice(0, 3).map((x) => x.t);
    const weak = hits.filter((x) => isWeak(x.t) && x.t.notes.length).map((x) => x.t).slice(0, 1);
    return { good, weak };
  }

    const sugg = ["Haluan verrata kahta asiakirjaversiota", "Miten teen kokousmuistion nopeammin?", "Pitää jäsentää säädösmuutoksen vaikutukset", "Haluan verrata kahta Excel-taulukkoa"];
    return '<div class="view-head"><div><span class="eyebrow">Agentti</span><h1>Kysy Puskaradiolta</h1><p>Agentti etsii kollegoiden kokeilemat menetelmät ja kertoo myös, mitä on jo kokeiltu ja mikä ei toiminut. Jos vastausta ei löydy, kysymys siirtyy muiden nähtäväksi.</p></div></div>' +

      '<form class="chat-in" id="askForm"><label class="sr" for="askIn">Kysymys Puskaradiolle</label><input class="inp" id="askIn" autocomplete="off" placeholder="Esim. Haluan löytää kahden asiakirjan väliset ristiriidat"><button class="btn btn-blue" type="submit">Kysy</button></form></div>' +
      '<aside class="rail"><section class="panel"><h2>Näin agentti vastaa</h2><p class="sub">Demossa agenttia simuloidaan avainsanahaulla. Oikea agentti toteutettaisiin Copilot Studiolla.</p><ul class="notes"><li>Näyttää ensin toimivaksi todetut vinkit</li><li>Kertoo kokeilumäärät ja statukset, mutta ei suosittele yhtä menetelmää ylitse muiden pienillä otoksilla</li><li>Kertoo myös, mitä on kokeiltu ja mikä ei toiminut</li><li>Vie kysymyksen muille, jos vastausta ei löydy</li></ul></section></aside></div>';
  }
  function botMsg(m) {
    let h = '<div class="msg bot"><span class="who">' + ICON.radio.replace("<svg", '<svg width="16" height="16"') + " Puskaradio</span>";

    if (good.length) {
      h += "<span>Löysin " + good.length + (good.length === 1 ? " työkaverin kokeileman menetelmän:" : " työkavereiden kokeilemaa menetelmää:") + "</span>";
      h += good.map((t) => '<div class="hit"><button type="button" data-open="' + t.id + '">' + esc(t.title) + '</button><span class="r">' + statusChip(t) + signal(t) + "</span></div>").join("");
    }
    if (weak.length) {
      const t = weak[0];
      h += '<div class="learned"><b>Kollegoiden kokemuksia tästä aiheesta:</b><ul class="notes" style="margin-top:6px">' + t.notes.slice(0, 2).map((n) => "<li>" + esc(n.t) + "</li>").join("") + "</ul></div>";
    }

      '<section class="panel"><h2>Pistetapahtumat</h2><p class="sub">Viimeisimmät ansaitut pisteet.</p><ul class="ledger">' + S.me.ledger.slice(0, 8).map((l) => "<li><span>" + esc(l.t) + "</span><b>+" + l.p + "</b></li>").join("") + "</ul></section></div>" +
      '<section class="panel" style="margin-top:16px"><h2>Omat vinkkisi</h2><p class="sub">Arviot näkyvät sinulle nimettöminä koosteena. Muut näkevät vain statuksen ja kokeilumäärän.</p>' +
      (mine.length ? mine.map((t) => { const s = stats(t); return '<div class="mytip"><div class="row" style="justify-content:space-between"><button class="btn btn-ghost btn-small" type="button" data-open="' + t.id + '">' + esc(t.title) + "</button>" + statusChip(t) + '</div><div class="fb"><div><b>' + t.r.hyvin + "</b>Toimi hyvin</div><div><b>" + t.r.osittain + "</b>Toimi osittain</div><div><b>" + t.r.ei + "</b>Ei toiminut</div><div><b>" + t.r.tark + "</b>Vaati tarkistamista</div></div>" + (t.notes.length ? '<ul class="notes">' + t.notes.slice(0, 3).map((n) => "<li>" + esc(n.t) + "<small>" + (n.by ? esc(n.by) + " · " : "") + days(n.d) + "</small></li>").join("") + "</ul>" : '<p class="sub">Ei vielä kommentteja.</p>') + "</div>"; }).join("") : '<div class="empty">Et ole vielä jakanut vinkkiä.</div>') +
      "</section>";
  }

  function metricsPanel() {
    const all = latest(S.tips).filter((t) => !t.old);
    const tried3 = all.filter((t) => stats(t).n >= 3).length;
    let n = 0, u = 0; all.forEach((t) => { const x = stats(t); n += x.n; u += x.u; });
    const roots = S.tips.filter((t) => !t.parent);
    const improved = roots.filter((r) => hasChild(r)).length;
    const avgSpread = all.length ? (all.reduce((a, t) => a + spread(t), 0) / all.length) : 0;
    return '<section class="panel" style="margin-bottom:22px"><h2>Puskaradion mittarit</h2><p class="sub">Koko talon tasolla, koosteena. Henkilöittäisiä lukuja ei raportoida. Demossa luvut lasketaan esimerkkivinkeistä.</p><div class="metrics">' +
      "<div><b>" + Math.round((tried3 / Math.max(1, all.length)) * 100) + " %</b>Kokeiluaste: vinkeistä vähintään 3 kokeilua</div>" +
      "<div><b>" + Math.round((u / Math.max(1, n)) * 100) + " %</b>Hyötyaste: kokeiluista koettu hyödylliseksi</div>" +
      "<div><b>" + avgSpread.toFixed(1).replace(".", ",") + "</b>Leviämisaste: yksikköä vinkkiä kohden keskimäärin</div>" +
      "<div><b>" + Math.round((improved / Math.max(1, roots.length)) * 100) + " %</b>Jatkokehitysaste: vinkeistä parannettu</div></div></section>";
  }
  function viewHow() {

      ["Joku kokeili vinkkiäsi", "Jakaja", "+2", ""], ["…ja se toimi hyvin / osittain", "Jakaja", "+3 / +1", ""], ["Vaikuttavuusbonus 5 / 10 / 25 kokeilijaa", "Jakaja", "+5 / +10 / +20", "Kerran per raja"],
      ["Kokeilu ja arvio", "Kokeilija", "+3", "Kerran per vinkki"], ["Ensimmäinen kokeilija", "Kokeilija", "+3", ""], ["Kirjallinen palaute", "Kokeilija", "+2", "Vähintään 20 merkkiä"],
      ["Parannettu versio", "Parantaja / alkuperäinen tekijä", "+8 / +5", ""], ["Hyväksytty vastaus avoimeen kysymykseen", "Vastaaja", "+5", ""], ["Vinkin avaaminen tai oman vinkin kokeilu", "", "0", ""]
    ];
    return '<div class="view-head"><div><span class="eyebrow">Säännöt lyhyesti</span><h1>Miten Puskaradio toimii</h1><p>Hyvä käyttötapa kulkee työkaverilta toiselle ja paranee matkalla. Jakaminen on aina turvallista: jokainen vinkki on arvokas, myös se, joka ei toiminut.</p></div></div>' +
      '<div class="why"><div><b>Tavoite</b>Tekoälyn hyödyntämistä halutaan lisätä ja vahvistaa kaikissa työtehtävissä.</div><div><b>Haaste</b>Hyvät käyttötavat jäävät yksittäisten työntekijöiden tietoon, ja sama ongelma ratkaistaan moneen kertaan.</div><div><b>Ratkaisu</b>AI Puskaradio tekee jakamisesta helppoa ja kokeilemisesta palkitsevaa. Hyvä tapa leviää ja paranee matkalla.</div></div>' +

      '<li><span class="status st-kokeile">' + ICON.try + 'Kokeile</span><small>Uusi tai vielä vakiintumaton vinkki</small></li>' +
      '<li><span class="status st-todettu">' + ICON.ok + 'Todettu toimivaksi</span><small>Vähintään 5 kokeilua ja vähintään 70 % hyödyllisiä</small></li>' +

      '<section class="panel"><h2>Kilpailu kolmella tasolla</h2><ul class="notes"><li><b>Yksilöt:</b> kauden pisteet. Listalla kärkikymmenikkö ja oma sijoitus, nimen voi piilottaa.</li><li><b>Tiimit:</b> kauden pisteet jäsentä kohden, joten pienikin tiimi voi voittaa.</li><li><b>Yksiköt:</b> kuinka paljon yksikön vinkit leviävät muihin yksiköihin.</li></ul><p class="sub" style="margin:10px 0 0">Kausi nollautuu kuukausittain, mutta tasot säilyvät aina. Kauden kärkikolmikko ja voittajatiimi saavat pysyvän kausimerkin, ja voittajat jäävät kunniagalleriaan. Listoilla näkyy vain kärki ja oma sijoitus, joten kukaan ei jää julkisesti häntäpäähän.</p></section>' +

  /* ---------- modal ---------- */
  let lastFocus = null;
  function openModal(html, label) {
    lastFocus = document.activeElement;

  }
  function closeModal() { $("#modalRoot").innerHTML = ""; if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); }
  const head = (title) => '<div class="drawer-head"><span class="eyebrow">' + esc(title) + '</span><button class="x" type="button" data-close aria-label="Sulje">×</button></div>';

  function openTip(id) {

    else if (tried) rate = '<div class="box"><h3>Kokeilit tätä</h3><p>Arviosi: <b>' + esc(RATINGS[tried]) + "</b>. Kiitos, arviosi auttaa seuraavaa kokeilijaa.</p></div>";

    else rate = '<form class="box form" id="rateForm" data-id="' + t.id + '"><fieldset><legend>Kokeilin tätä – miten kävi?</legend><div class="opts">' +
      Object.keys(RATINGS).map((k) => '<label class="opt"><input type="radio" name="rating" value="' + k + '" required> ' + RATINGS[k] + "</label>").join("") + "</div></fieldset>" +
      '<div class="field"><label class="fl" for="rateNote">Mikä vaikutti lopputulokseen? <span>(vapaaehtoinen, +2 p kun vähintään 20 merkkiä)</span></label><textarea class="inp" id="rateNote" placeholder="Esim. toimi, kun rajasin tehtävän yhteen lukuun"></textarea></div>' +
      '<label class="confirm"><input type="checkbox" id="rateName"> Näytä nimeni kommentin yhteydessä</label><p class="sub" style="margin:0">Arviosi on nimetön: jakaja näkee arviot vain koosteena. Palaute koskee menetelmää, ei ihmistä.</p><div class="row"><button class="btn btn-primary" type="submit">Tallenna arvio</button>' + (s.n === 0 ? '<span class="muted" style="font-size:13px">Olet ensimmäinen kokeilija: +3 lisäpistettä</span>' : "") + "</div></form>";
    const publicPct = st && st.k === "todettu" ? " · " + s.pct + " % kokeilijoista hyötyi" : "";
    const html = head("Vinkki") + '<div class="drawer-body">' +
      "<div>" + '<div class="d-meta">' + catTag(t) + "<span class=\"muted\">" + esc(t.tool) + "</span></div>" +
      '<h2 class="d-title" style="margin-top:8px">' + esc(t.title) + '</h2><p class="d-hyoty">' + esc(t.hyoty) + "</p></div>" +
      '<div class="d-meta">' + statusChip(t) + signal(t) + (spread(t) ? '<span class="muted">Levinnyt ' + spread(t) + " yksikköön</span>" : "") + '<span class="muted">' + esc(publicPct) + "</span></div>" +
