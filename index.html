      rate +
      (ch.length > 1 ? '<div class="box"><h3>Versiohistoria</h3><ol class="chain">' + ch.map((v, i) => '<li class="' + (v.id === t.id ? "cur" : "") + '"><span class="node">' + (i + 1) + '</span><div><button type="button" data-open="' + v.id + '">' + esc(v.title) + "</button><small>" + (v.mine ? "Sinä" : esc(v.author.name)) + " · " + (i === 0 ? "alkuperäinen" : esc(v.change)) + "</small></div></li>").join("") + "</ol></div>" : "") +
      (t.notes.length ? '<div class="box"><h3>Kokeilijoiden huomiot</h3><ul class="notes">' + t.notes.map((n) => "<li>" + esc(n.t) + "<small>" + (n.by ? esc(n.by) + " · " : "") + days(n.d) + "</small></li>").join("") + "</ul></div>" : "") +
      '<div class="row"><button class="btn btn-ghost" type="button" data-improve="' + t.id + '">Paranna vinkkiä</button><span class="muted" style="font-size:13px">Sinulle +8 p, alkuperäiselle tekijälle +5 p</span></div>' +
      "</div>";
    openModal(html, t.title);
  }

  /* share / improve flow */
  let draft = null;
  function guessCat(s) {
    s = s.toLowerCase();
    if (/kokou|palaver|muistio|teams|esity|dia/.test(s)) return "kok";
    if (/tiivis|vertai|excel|taulu|analy|raport|erot/.test(s)) return "tiiv";
    if (/kirjoi|luonno|sähköp|kirje|teksti|sävy|ohje/.test(s)) return "kirj";
    if (/priori|tehtäv|aikata|viiko|suunnit/.test(s)) return "oma";
    return "kirj";
  }
  function guessTool(s) { s = s.toLowerCase(); if (/excel|taulukko/.test(s)) return "Excel"; if (/word|asiakirja|muistio/.test(s)) return "Word"; if (/teams|kokous/.test(s)) return "Teams"; if (/outlook|sähköp/.test(s)) return "Outlook"; return "Copilot Chat"; }
  function makeTitle(s) { let t = s.split(/[.!?\n]/)[0].trim().replace(/\b(tämän|tästä|näiden|näistä|tätä|nämä)\s+/gi, ""); t = t.charAt(0).toUpperCase() + t.slice(1); return t.length > 60 ? t.slice(0, 57).replace(/\s+\S*$/, "") + "…" : t; }
  const HYOTY = { kok: "Kokouksiin ja viestintään liittyvä työ nopeutuu.", tiiv: "Saat pitkästä aineistosta olennaisen esiin nopeammin.", kirj: "Tekstin ensimmäinen versio tai viimeistely syntyy nopeammin.", oma: "Oma työ jäsentyy ja tärkein tehtävä löytyy helpommin.", hyv: "Tekoälyn käyttö on varmempaa ja tulokset luotettavampia." };

  function openShare(opts) {
    opts = opts || {};
    const base = opts.improve ? tip(opts.improve) : null;
    draft = { step: 1, improve: base ? base.id : null, question: opts.question || null, miten: base ? base.miten : "", prompti: base ? base.prompti : "", tarkistin: "", change: "" };
    renderShare();
  }
  function renderShare() {
    const base = draft.improve ? tip(draft.improve) : null;
    const q = draft.question ? S.questions.find((x) => x.id === draft.question) : null;
    const steps = '<div class="steps-ind"><span ' + (draft.step === 1 ? 'aria-current="step"' : "") + ">1. Kerro, mitä teit</span><span>›</span><span " + (draft.step === 2 ? 'aria-current="step"' : "") + ">2. Hyväksy luonnos</span></div>";
    let body;
    if (draft.step === 1) {
      body = (base ? '<div class="dup">Teet parannettua versiota vinkistä <b>“' + esc(base.title) + "”</b> (" + esc(base.mine ? "Sinä" : base.author.name) + "). Alkuperäinen tekijä näkyy versiohistoriassa.</div>" : "") +
        (q ? '<div class="dup">Vastaat kysymykseen: <b>“' + esc(q.text) + "”</b></div>" : "") +
        '<p class="muted" style="margin:0">Riittää, että kerrot omin sanoin. Agentti luonnostelee otsikon, hyödyn ja luokan, ja sinä vain hyväksyt ne. Keskeneräisenkin kokeilun saa jakaa.</p>' +
        '<form class="form" id="shareForm">' +
        (base ? '<div class="field"><label class="fl" for="sChange">Mitä paransit?</label><input class="inp" id="sChange" required placeholder="Esim. tulos taulukkona, rajaus lukuihin"></div>' : "") +
        '<div class="field"><label class="fl" for="sMiten">Mitä teit?</label><textarea class="inp" id="sMiten" required placeholder="Esim. Pyysin Copilotia tiivistämään pitkän raportin jokaisen luvun yhteen virkkeeseen ja näin heti, missä rakenne ontuu.">' + esc(draft.miten) + '</textarea></div>' +
        '<div class="field"><label class="fl" for="sPrompt">Prompti <span>(ilman tunnistettavia tietoja)</span></label><textarea class="inp" id="sPrompt" required style="font-family:var(--f-mono);font-size:13.5px">' + esc(draft.prompti) + '</textarea></div>' +
        '<div class="field"><label class="fl" for="sTark">Miten tarkistit tuloksen? <span>(vapaaehtoinen, +1 p)</span></label><input class="inp" id="sTark" value="' + esc(draft.tarkistin) + '" placeholder="Esim. vertasin yhteenvetoa alkuperäiseen"></div>' +
        '<label class="confirm"><input type="checkbox" id="sOk" required> Vinkki ei sisällä salassa pidettävää tietoa eikä henkilötietoja.</label>' +
        '<div class="row"><button class="btn btn-primary" type="submit">Luonnostele vinkki</button>' + (!base ? '<button class="btn btn-ghost" type="button" id="fillEx">Täytä esimerkillä</button>' : "") + "</div></form>";
    } else {
      const dup = !base ? findDup() : null;
      body = '<div class="agent-note">' + ICON.radio + "<span>Puskaradion agentti luonnosteli vinkin kertomasi perusteella. Muokkaa tarvittaessa ja laita kiertoon. <small class=\"muted\">(Demossa luonnos tehdään yksinkertaisilla säännöillä.)</small></span></div>" +
        (dup ? '<div class="dup"><b>Samankaltainen vinkki on jo kierrossa:</b> “' + esc(dup.title) + '”. Haluatko mieluummin parantaa sitä? <div class="row" style="margin-top:8px"><button class="btn btn-ghost btn-small" type="button" data-improve="' + dup.id + '">Paranna sitä</button><button class="btn btn-ghost btn-small" type="button" data-open="' + dup.id + '">Katso vinkki</button></div></div>' : "") +
        '<form class="form" id="publishForm">' +
        '<div class="field"><label class="fl" for="pTitle">Otsikko</label><input class="inp" id="pTitle" maxlength="60" required value="' + esc(draft.title) + '"></div>' +
        '<div class="field"><label class="fl" for="pHyoty">Hyöty <span>(näkyy vinkin etupuolella)</span></label><input class="inp" id="pHyoty" required value="' + esc(draft.hyoty) + '"></div>' +
        '<div class="row"><div class="field" style="flex:1 1 200px"><label class="fl" for="pCat">Luokka</label><select class="inp" id="pCat">' + Object.keys(CATS).map((k) => '<option value="' + k + '"' + (k === draft.cat ? " selected" : "") + ">" + CATS[k].name + "</option>").join("") + '</select></div>' +
        '<div class="field" style="flex:1 1 160px"><label class="fl" for="pTool">Työkalu</label><select class="inp" id="pTool">' + TOOLS.map((x) => "<option" + (x === draft.tool ? " selected" : "") + ">" + x + "</option>").join("") + "</select></div></div>" +
        '<div class="field"><label class="fl" for="pTeh">Tehtävä <span>(vapaaehtoinen)</span></label><input class="inp" id="pTeh" value="' + esc(draft.tehtava) + '" placeholder="Mihin työhön vinkki sopii? Esim. pitkät selvitykset"></div>' +
        '<div class="row"><button class="btn btn-primary" type="submit">Laita kiertoon</button><button class="btn btn-ghost" type="button" id="backBtn">Takaisin</button></div></form>';
    }
    openModal(head(base ? "Paranna vinkkiä" : "Jaa vinkki") + '<div class="drawer-body">' + steps + body + "</div>", base ? "Paranna vinkkiä" : "Jaa vinkki");
  }
  function findDup() {
    const q = tokens(draft.title + " " + draft.miten);
    let best = null, bs = 0;
    latest(S.tips).forEach((t) => { if (t.mine) return; const m = matchScore(t, q); if (m > bs) { bs = m; best = t; } });
    return bs >= 7 ? best : null;
  }

  /* ---------- actions ---------- */
  function rate(id, rating, note, named) {
    const t = tip(id); if (!t || S.me.tried[id]) return;
    const first = stats(t).n === 0;
    t.r[rating]++; t.s++; S.me.tried[id] = rating; S.me.trials++;
    if (note && note.trim()) t.notes.unshift({ t: note.trim(), d: 0, by: named ? "Sinä" : "" });
    let p = 3, lbl = "Kokeilit vinkkiä ja annoit arvion";
    if (first) { p += 3; lbl += ", ensimmäisenä"; }
    if (note && note.trim().length >= 20) { p += 2; lbl += " ja kirjallisen palautteen"; }
    award(p, lbl);
    save(); openTip(id); render();
  }
  function publish(f) {
    const base = draft.improve ? tip(draft.improve) : null;
    const id = "u" + Date.now();
    const t = { id, mine: true, title: f.title, hyoty: f.hyoty, cat: f.cat, tool: f.tool, tehtava: f.tehtava || "–", miten: draft.miten, prompti: draft.prompti, tarkistin: draft.tarkistin, huomio: "", author: ME, days: 0, r: { hyvin: 0, osittain: 0, ei: 0, tark: 0 }, s: 0, notes: [], parent: base ? base.id : null, change: draft.change, old: "" };
    S.tips.push(t);
    if (base) {
      award(8, "Paransit vinkkiä");
      setTimeout(() => toast(esc(base.mine ? "Sinä" : short(base.author.name)) + " sai +5 alkuperäisenä tekijänä"), 500);
    } else {
      award(5 + (draft.tarkistin ? 1 : 0), draft.tarkistin ? "Jaoit vinkin ja kerroit, miten tarkistit" : "Jaoit vinkin");
    }
    if (draft.question) {
      S.questions = S.questions.filter((x) => x.id !== draft.question);
      S.me.notifs.unshift({ t: "Vastasit kysymykseen vinkillä. Saat +5, kun kysyjä hyväksyy vastauksen.", d: 0 });
      setTimeout(() => { award(5, "Kysyjä hyväksyi vastauksesi"); save(); render(); }, 2200);
    }
    save(); closeModal(); filterCat = "all"; query = "";
    if (location.hash !== "#vinkit") location.hash = "vinkit"; else render();
    setTimeout(() => openTip(id), 250);
  }
  function simulateWeek() {
    const mine = S.tips.filter((t) => t.mine);
    if (!mine.length) { toast("Jaa ensin oma vinkki, niin näet miltä kollegoiden kokeilut näyttävät."); return; }
    const names = ["Anna", "Pekka", "Laura", "Mikko", "Jenni", "Sara", "Antti"];
    const lines = ["Toimi hyvin, kun rajasin aineiston.", "Hyvä pohja, muokkasin promptia vähän.", "Tähän tehtävään ei sopinut, mutta idea oli hyvä.", "Säästi aikaa ensimmäisessä versiossa."];
    let total = 0;
    mine.forEach((t) => {
      const before = stats(t).n; const add = 2 + Math.floor(Math.random() * 4);
      let hy = 0, os = 0;
      for (let i = 0; i < add; i++) {
        const x = Math.random(); const k = x < 0.6 ? "hyvin" : x < 0.82 ? "osittain" : x < 0.92 ? "tark" : "ei";
        t.r[k]++; t.s++; if (k === "hyvin") hy++; if (k === "osittain") os++;
        if (before + i === 0) { S.me.season += 5; S.me.alltime += 5; S.me.ledger.unshift({ t: "Vinkkisi sai ensimmäisen kokeilunsa", p: 5, d: 0 }); total += 5; }
      }
      const p = add * 2 + hy * 3 + os; S.me.season += p; S.me.alltime += p; total += p;
      S.me.ledger.unshift({ t: "Kokeilut vinkkiisi “" + t.title + "”", p, d: 0 });
      const after = stats(t).n;
      [[5, 5], [10, 10], [25, 20]].forEach(([lim, b]) => { if (before < lim && after >= lim) { S.me.season += b; S.me.alltime += b; total += b; S.me.ledger.unshift({ t: "Vinkkisi ylitti " + lim + " kokeilua", p: b, d: 0 }); } });
      const cm = Math.random() < 0.8 ? 1 : 0;
      if (cm) t.notes.unshift({ t: lines[Math.floor(Math.random() * lines.length)], d: 0 });
      S.me.notifs.unshift({ t: "Vinkkiäsi “" + t.title + "” kokeili tällä viikolla " + add + " kollegaa" + (cm ? ". " + names[Math.floor(Math.random() * names.length)] + " kertoi, mitä muuttaisi." : "."), d: 0 });
      const st = status(t); if (st && st.k === "todettu" && before < 5) S.me.notifs.unshift({ t: "Vinkkisi “" + t.title + "” sai Todettu toimivaksi -statuksen.", d: 0 });
    });
    toast("Viikon aikana kollegat kokeilivat vinkkejäsi: <b>+" + total + "</b>");
    save(); render();
  }

  /* ---------- render & routing ---------- */
  let skin = "neon";
  try { skin = localStorage.getItem(KEY + "-skin") || "neon"; } catch (e) { /* default */ }
  function applySkin() {
    document.body.classList.toggle("neon", skin === "neon");
    $("#skinBtn").textContent = skin === "neon" ? "Vaihda asialliseen ilmeeseen" : "Vaihda Neon 86 -ilmeeseen";
  }

  function render() {
    applySkin();
    const v = (location.hash || "#vinkit").slice(1);
    const view = ["vinkit", "tulostaulu", "kysy", "oma", "miten"].includes(v) ? v : "vinkit";
    document.querySelectorAll("nav.tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.view === view ? "page" : "false"));
    const lv = level(S.me.alltime);
    $("#mePill").innerHTML = '<span><span class="pts">' + S.me.season + '</span> p kaudella</span><span class="lvl">' + badge(lv.i, 20, true) + esc(lv.l.name) + "</span>";
    $("#mePill").setAttribute("aria-label", "Oma Puskaradio: " + S.me.season + " pistettä tällä kaudella, taso " + lv.l.name);
    const m = $("#main");
    const focusQ = document.activeElement && document.activeElement.id === "q"; const caret = focusQ ? document.activeElement.selectionStart : 0;
    m.innerHTML = view === "kysy" ? viewAsk() : view === "oma" ? viewMe() : view === "miten" ? viewHow() : view === "tulostaulu" ? viewLeaders() : viewBoard();
    if (focusQ && $("#q")) { const q = $("#q"); q.focus(); try { q.setSelectionRange(caret, caret); } catch (e) {} }
    if (view === "kysy") { const l = $("#log"); if (l && S.chat.length) l.lastElementChild.scrollIntoView({ block: "nearest" }); }
  }
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-lb],[data-open],[data-close],[data-cat],[data-improve],[data-answer],[data-sugg],[data-post],[data-copy],#tickBtn,#shareBtn,#heroShare,#obShare,#obAsk,#obHide,#skinBtn,#resetBtn,#simBtn,#fillEx,#backBtn,#ov");
    if (!el) return;
    if (el.id === "ov") { if (e.target === el) closeModal(); return; }
    if (el.dataset.lb) { lbTab = el.dataset.lb; render(); const b = document.querySelector('[data-lb="' + lbTab + '"]'); if (b) b.focus(); return; }
    if (el.dataset.open) { openTip(el.dataset.open); return; }
    if ("close" in el.dataset) { closeModal(); return; }
    if (el.dataset.cat) { filterCat = el.dataset.cat; render(); return; }
    if (el.dataset.improve) { openShare({ improve: el.dataset.improve }); return; }
    if (el.dataset.answer) { openShare({ question: el.dataset.answer }); return; }
    if (el.dataset.sugg) { const i = $("#askIn"); i.value = el.dataset.sugg; i.focus(); return; }
    if (el.dataset.post) {
      const m = S.chat.find((x) => x.id === el.dataset.post); if (!m) return; m.posted = true;
      const qtext = S.chat[S.chat.indexOf(m) - 1].text;
      S.questions.unshift({ id: "q" + Date.now(), text: qtext, by: "Sinä", days: 0 });
      toast("Kysymys on nyt muiden nähtävillä"); save(); render(); return;
    }
    if ("copy" in el.dataset) {
      const txt = $("#promptText").firstChild.textContent;
      const done = () => { el.textContent = "Kopioitu"; setTimeout(() => { el.textContent = "Kopioi prompti"; }, 1600); };
      try { navigator.clipboard.writeText(txt).then(done, () => selectPrompt()); } catch (err) { selectPrompt(); }
      return;
    }
    if (el.id === "tickBtn") { tickerPaused = !tickerPaused; render(); const b = $("#tickBtn"); if (b) b.focus(); return; }
    if (el.id === "shareBtn" || el.id === "heroShare" || el.id === "obShare") { openShare(); return; }
    if (el.id === "obAsk") { location.hash = "kysy"; return; }
    if (el.id === "obHide") { S.onboarded = true; save(); render(); return; }
    if (el.id === "skinBtn") { skin = skin === "neon" ? "asiallinen" : "neon"; try { localStorage.setItem(KEY + "-skin", skin); } catch (err) { /* ignore */ } render(); return; }
    if (el.id === "resetBtn") { S = seed(); save(); closeModal(); filterCat = "all"; query = ""; render(); toast("Demo palautettu alkutilaan"); return; }
    if (el.id === "simBtn") { simulateWeek(); return; }
    if (el.id === "fillEx") {
      $("#sMiten").value = "Pyysin Copilotia tiivistämään pitkän selvityksen jokaisen luvun yhteen virkkeeseen. Listasta näki heti, missä kohdassa rakenne ontuu.";
      $("#sPrompt").value = "Tiivistä tämän selvityksen jokainen luku yhteen virkkeeseen. Merkitse sen jälkeen kohdat, joissa luku ei näytä jatkavan edellisestä.";
      $("#sTark").value = "Luin merkityt kohdat itse uudelleen."; $("#sOk").checked = true; return;
    }
    if (el.id === "backBtn") { draft.step = 1; renderShare(); return; }
  });
  function selectPrompt() { const r = document.createRange(); r.selectNodeContents($("#promptText").firstChild); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Prompti valittu – kopioi se näppäinyhdistelmällä"); }

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.id === "rateForm") {
      const r = f.querySelector("input[name=rating]:checked"); if (!r) return;
      rate(f.dataset.id, r.value, $("#rateNote").value, $("#rateName").checked);
    } else if (f.id === "shareForm") {
      draft.miten = $("#sMiten").value.trim(); draft.prompti = $("#sPrompt").value.trim(); draft.tarkistin = $("#sTark").value.trim();
      if ($("#sChange")) draft.change = $("#sChange").value.trim();
      const base = draft.improve ? tip(draft.improve) : null;
      const all = draft.miten + " " + draft.prompti;
      draft.cat = base ? base.cat : guessCat(all); draft.tool = base ? base.tool : guessTool(all);
      draft.title = base ? (base.title + (draft.change ? " – " + draft.change : "")).slice(0, 60) : makeTitle(draft.prompti || draft.miten);
      draft.hyoty = base ? base.hyoty : HYOTY[draft.cat];
      draft.tehtava = base ? base.tehtava : "";
      draft.step = 2; renderShare();
    } else if (f.id === "publishForm") {
      publish({ title: $("#pTitle").value.trim(), hyoty: $("#pHyoty").value.trim(), cat: $("#pCat").value, tool: $("#pTool").value, tehtava: $("#pTeh").value.trim() });
    } else if (f.id === "askForm") {
      const v = $("#askIn").value.trim(); if (!v) return;
      const res = askAgent(v);
      S.chat.push({ who: "user", text: v });
      S.chat.push({ who: "bot", id: "m" + Date.now(), good: res.good.map((t) => t.id), weak: res.weak.map((t) => t.id), posted: false });
      S.chat = S.chat.slice(-12);
      save(); render(); const i = $("#askIn"); if (i) i.focus();
    }
  });
  document.addEventListener("change", (e) => { if (e.target.id === "hideName") { S.me.hideName = e.target.checked; save(); toast(S.me.hideName ? "Nimesi on piilotettu tulostaululta" : "Nimesi näkyy tulostaululla"); } });
  document.addEventListener("input", (e) => { if (e.target.id === "q") { query = e.target.value; render(); } });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("#ov")) closeModal(); });

  render();
})();
</script>

</body>
</html>
